<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rosewood Medical Center</title>

<style>
/* SEU CSS ORIGINAL — NÃO ALTERADO */
:root{
  --accent:#ff2b9e;
  --accent-strong:#d81b7a;
  --muted:#666;
  --card-bg:#fff;
  --bg:#faf7fb;
}
*{box-sizing:border-box}
body{font-family:Inter, Arial, sans-serif; margin:0; background:var(--bg); color:#111}
header{display:flex;align-items:center;gap:18px;padding:18px 24px;border-bottom:1px solid #eee;background:linear-gradient(90deg,#fff,#fff);}
header img{height:72px;width:auto}
header h1{font-size:18px;margin:0;color:var(--accent-strong)}
.wrap{max-width:1100px;margin:28px auto;padding:0 18px}
.grid{display:grid;grid-template-columns:1fr 420px;gap:24px}
.panel{background:var(--card-bg);padding:18px;border-radius:12px;box-shadow:0 8px 28px rgba(16,8,33,0.04)}
label{display:block;margin-top:10px;font-size:13px;color:var(--muted)}
input,select,textarea{width:100%;padding:10px;margin-top:6px;border:1px solid #e9e6ea;border-radius:8px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>div{flex:1;min-width:120px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
button{background:var(--accent);color:#fff;border:none;padding:10px 14px;border-radius:8px;cursor:pointer;font-weight:600}
button.ghost{background:transparent;color:var(--accent-strong);border:1px solid rgba(216,27,122,0.06);padding:9px}
.small{font-size:13px;padding:6px 10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:14px}
.card{background:#fff;border-radius:10px;padding:12px;border:1px solid rgba(240,200,230,0.4);display:flex;gap:10px;align-items:flex-start}
.avatar{width:76px;height:76px;border-radius:10px;overflow:hidden;background:#fbf0f7;display:flex;align-items:center;justify-content:center}
.avatar img{width:100%;height:100%;object-fit:cover}
.info h3{margin:0;font-size:16px;color:var(--accent-strong)}
.info .meta{font-size:13px;color:var(--muted);margin-top:6px}
.info .obs{font-size:13px;margin-top:8px;color:#333}
.card .controls{display:flex;gap:8px;margin-top:10px}
footer{text-align:center;color:var(--muted);margin:18px 0;font-size:13px}
#loginBox{position:fixed;inset:0;background:linear-gradient(180deg, rgba(15,7,24,0.6), rgba(15,7,24,0.6));display:flex;align-items:center;justify-content:center;z-index:9999}
.loginCard{width:360px;background:#fff;padding:20px;border-radius:12px;box-shadow:0 20px 60px rgba(2,0,12,0.35);text-align:center}
.loginCard img{height:70px;margin-bottom:8px}
.toast{position:fixed;right:20px;bottom:20px;background:#111;color:#fff;padding:10px 14px;border-radius:8px;display:none}
.logoutBtnHeader{
  margin-left:auto;
  background:#333;
  color:#fff;
  padding:8px 14px;
  border-radius:8px;
  display:none;
  border:none;
  cursor:pointer;
}
@media(max-width:720px){
  .logoutBtnHeader{display:none}
}
</style>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>

<body>

<header>
  <img src="https://i.imgur.com/wv6Uhnk.png" alt="logo">
  <h1>Rosewood Medical Center</h1>
  <!-- botão logout (escondido por padrão; aparece ao logar) -->
  <button id="logoutBtn" class="logoutBtnHeader">Logout</button>
</header>

<main class="wrap">
<div class="grid">

<div class="panel" id="formPanel">
<h2>Novo cadastro / Editar</h2>
<form id="form">
<label>Nome</label><input id="nome" required>
<label>CPF</label><input id="cpf">

<div class="row">
<div><label>Idade</label><input id="idade" type="number"></div>
<div><label>Altura</label><input id="altura"></div>
<div><label>Sangue</label>
<select id="sangue">
<option></option><option>A+</option><option>A-</option><option>B+</option><option>B-</option>
</select></div>
</div>

<label>Observações</label>
<textarea id="obs"></textarea>

<label>Foto</label>
<input type="file" id="foto" accept="image/*">
<div id="preview" class="avatar">sem foto</div>

<div class="actions">
<button id="salvarBtn" type="submit">Salvar</button>
<button id="cancelEdit" type="button" class="ghost" style="display:none">Cancelar</button>
</div>
</form>
</div>

<div class="panel">
<h2>Banco de dados</h2>
<input id="buscar" placeholder="Buscar por nome ou CPF">
<div id="cards" class="cards"></div>
</div>

</div>
</main>

<div id="loginBox">
<div class="loginCard">
<img src="https://i.imgur.com/wv6Uhnk.png" alt="logo">
<h2>Login</h2>
<input id="loginEmail" placeholder="Email">
<input id="loginSenha" type="password" placeholder="Senha">
<div style="display:flex;gap:8px;margin-top:8px">
  <button id="btnEntrar" style="flex:1">Entrar</button>
  <button id="btnRegistrar" style="flex:1;background:#666">Registrar</button>
</div>
<div id="loginMsg" style="margin-top:8px;color:#a00"></div>
</div>
</div>

<div id="toast" class="toast"></div>

<script>
/* =========================
   FIREBASE
   ========================= */
const firebaseConfig = {
  apiKey: "AIzaSyBRFlVvCNQRj9QEQcfcTPWJVletd34vu2g",
  authDomain: "rosewood-a17a5.firebaseapp.com",
  databaseURL: "https://rosewood-a17a5-default-rtdb.firebaseio.com",
  projectId: "rosewood-a17a5",
  storageBucket: "rosewood-a17a5.appspot.com",
  messagingSenderId: "20548352872",
  appId: "1:20548352872:web:c62d40e9dea3efbb80b4dd"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

/* =========================
   CONFIG
   ========================= */
const ADMINS = ["admin@rosewood.com"]; // coloque os e-mails de admin aqui
const AUTO_LOGOUT_MS = 6 * 60 * 60 * 1000; // 6 horas em ms

/* =========================
   ELEMENTS
   ========================= */
const form = document.getElementById('form');
const formPanel = document.getElementById('formPanel');
const salvarBtn = document.getElementById('salvarBtn');
const cancelEdit = document.getElementById('cancelEdit');
const buscar = document.getElementById('buscar');
const cards = document.getElementById('cards');
const preview = document.getElementById('preview');
const foto = document.getElementById('foto');
const logoutBtn = document.getElementById('logoutBtn');

const loginBox = document.getElementById('loginBox');
const loginEmail = document.getElementById('loginEmail');
const loginSenha = document.getElementById('loginSenha');
const btnEntrar = document.getElementById('btnEntrar');
const btnRegistrar = document.getElementById('btnRegistrar');
const loginMsg = document.getElementById('loginMsg');

let editingId = null;
let currentPhoto = null;
let cache = {};
let sessionTimer = null;

/* =========================
   HELPERS
   ========================= */
function showToast(msg, time=3000){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(t._to);
  t._to = setTimeout(()=> t.style.display='none', time);
}

function isAdmin(){
  return auth.currentUser && auth.currentUser.email && ADMINS.includes(auth.currentUser.email.toLowerCase());
}

/* =========================
   IMAGE PREVIEW
   ========================= */
foto.addEventListener('change', (e)=>{
  const f = e.target.files[0];
  if(!f){ preview.innerText = 'sem foto'; currentPhoto = null; return; }
  const r = new FileReader();
  r.onload = ()=> {
    currentPhoto = r.result;
    preview.innerHTML = `<img src="${currentPhoto}" alt="foto">`;
  };
  r.readAsDataURL(f);
});

/* =========================
   AUTH (login/register/logout + auto-logout)
   ========================= */
btnEntrar.addEventListener('click', ()=>{
  loginMsg.textContent = '';
  const e = (loginEmail.value||'').trim();
  const s = loginSenha.value;
  if(!e || !s){ loginMsg.textContent = 'Preencha email e senha'; return; }
  btnEntrar.disabled = true;
  auth.signInWithEmailAndPassword(e,s)
    .catch(err=> loginMsg.textContent = err.message)
    .finally(()=> btnEntrar.disabled = false);
});

btnRegistrar.addEventListener('click', ()=>{
  loginMsg.textContent = '';
  const e = (loginEmail.value||'').trim();
  const s = loginSenha.value;
  if(!e || !s){ loginMsg.textContent = 'Preencha email e senha'; return; }
  btnRegistrar.disabled = true;
  auth.createUserWithEmailAndPassword(e,s)
    .then(()=> showToast('Registrado com sucesso — já logado'))
    .catch(err=> loginMsg.textContent = err.message)
    .finally(()=> btnRegistrar.disabled = false);
});

logoutBtn.addEventListener('click', ()=>{
  auth.signOut();
});

/* Start/Reset session timer */
function startSessionTimer(){
  if(sessionTimer) clearTimeout(sessionTimer);
  sessionTimer = setTimeout(()=>{
    alert('Sua sessão expirou. Faça login novamente.');
    auth.signOut();
  }, AUTO_LOGOUT_MS);
}

/* on auth change */
auth.onAuthStateChanged(u=>{
  if(!u){
    // show login overlay
    loginBox.style.display = 'flex';
    formPanel.style.display = 'none';
    logoutBtn.style.display = 'none';
    // clear cached data
    cache = {};
    render();
    return;
  }
  // logged in
  loginBox.style.display = 'none';
  logoutBtn.style.display = 'inline-block';
  aplicarPermissoes();
  // start listener and session timer
  startListening();
  startSessionTimer();
});

/* =========================
   PERMISSIONS / LISTENING
   ========================= */
function aplicarPermissoes(){
  formPanel.style.display = isAdmin() ? 'block' : 'none';
}

function startListening(){
  // attach once: we will use on('value') so it stays synced
  db.ref('cadastros').on('value', snap=>{
    cache = snap.val() || {};
    render();
  });
}

/* =========================
   RENDER / SEARCH
   ========================= */
function render(){
  const q = (buscar.value||'').toLowerCase();
  cards.innerHTML = '';

  // prevent crash when cache empty
  const arr = Object.values(cache || {});
  // newest first if _ts available
  arr.sort((a,b)=> (b._ts||0) - (a._ts||0));

  arr.forEach(p=>{
    const nome = (p.nome||'').toLowerCase();
    const cpf = (p.cpf||'').toLowerCase();
    if(q && !nome.includes(q) && !cpf.includes(q)) return;

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="avatar">${p.foto?`<img src="${p.foto}" alt="foto">`:""}</div>
      <div class="info">
        <h3>${escapeHtml(p.nome||'—')}</h3>
        <div class="meta">CPF: ${escapeHtml(p.cpf||'—')}</div>
        <div class="meta">Idade: ${escapeHtml(p.idade||'—')} | Sangue: ${escapeHtml(p.sangue||'—')}</div>
        ${p.obs?`<div class="obs">${escapeHtml(p.obs)}</div>`:''}
        ${isAdmin()?`<div class="controls"><button class="small" data-edit="${p.id}">Editar</button><button class="small ghost" data-del="${p.id}">Excluir</button></div>`:''}
      </div>
    `;
    cards.appendChild(card);
  });

  // delegate listeners
  cards.querySelectorAll('[data-edit]').forEach(b=> b.onclick = ()=> startEdit(b.dataset.edit));
  cards.querySelectorAll('[data-del]').forEach(b=> b.onclick = ()=> doDelete(b.dataset.del));
}

buscar.addEventListener('input', ()=>{
  // reset session timer on activity (optional)
  if(auth.currentUser) startSessionTimer();
  render();
});

/* =========================
   CRUD: create / update / delete
   ========================= */
form.addEventListener('submit', async (e)=>{
  e.preventDefault();
  if(!isAdmin()){ alert('Apenas administradores podem salvar'); return; }

  const id = editingId || db.ref('cadastros').push().key;
  const data = {
    id,
    nome: (document.getElementById('nome').value||'').trim(),
    cpf: (document.getElementById('cpf').value||'').trim(),
    idade: (document.getElementById('idade').value||'').trim(),
    altura: (document.getElementById('altura').value||'').trim(),
    sangue: (document.getElementById('sangue').value||'').trim(),
    obs: (document.getElementById('obs').value||'').trim(),
    foto: currentPhoto || '',
    _ts: Date.now()
  };

  try{
    await db.ref('cadastros/' + id).set(data);
    showToast(editingId ? 'Cadastro atualizado' : 'Cadastro criado');
    resetForm();
  }catch(err){
    showToast('Erro ao salvar: ' + err.message);
  }
});

/* start editing */
function startEdit(id){
  const p = cache[id];
  if(!p) return showToast('Registro não encontrado');
  editingId = id;
  document.getElementById('nome').value = p.nome || '';
  document.getElementById('cpf').value = p.cpf || '';
  document.getElementById('idade').value = p.idade || '';
  document.getElementById('altura').value = p.altura || '';
  document.getElementById('sangue').value = p.sangue || '';
  document.getElementById('obs').value = p.obs || '';
  currentPhoto = p.foto || null;
  preview.innerHTML = currentPhoto ? `<img src="${currentPhoto}" alt="foto">` : 'sem foto';
  salvarBtn.innerText = 'Salvar alteração';
  cancelEdit.style.display = 'inline-block';
  // reset session timer on activity
  if(auth.currentUser) startSessionTimer();
}

/* delete */
function doDelete(id){
  if(!confirm('Deseja apagar este cadastro?')) return;
  db.ref('cadastros/' + id).remove().then(()=> showToast('Apagado'));
}

/* cancel / reset */
cancelEdit.addEventListener('click', ()=>{
  resetForm();
});

function resetForm(){
  editingId = null;
  form.reset();
  currentPhoto = null;
  preview.innerText = 'sem foto';
  salvarBtn.innerText = 'Salvar';
  cancelEdit.style.display = 'none';
}

/* =========================
   helper: escape HTML
   ========================= */
function escapeHtml(str){
  if(!str && str !== 0) return '';
  return String(str).replace(/[&<>"'`]/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;',"`":'&#96;'}[s]));
}

/* =========================
   delegate edit/delete from render
   ========================= */
function startEditWrapper(id){ startEdit(id); }
function doDeleteWrapper(id){ doDelete(id); }

/* =========================
   quick bind (for inline old handlers)
   ========================= */
window.edit = startEdit;
window.del = doDelete;

/* =========================
   session start when page loaded (if already logged)
   ========================= */
if(auth.currentUser) startSessionTimer();
</script>

</body>
</html>
